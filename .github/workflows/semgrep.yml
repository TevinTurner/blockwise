# Semgrep — second-opinion SAST for Blockwise, Phase 0
# DRAFT — not yet run in the Blockwise repo. Verify on the first push.
# Semgrep OSS / free platform tier covers up to 10 contributors and
# 10 repos (checked 2026-11-21). CodeQL default setup is the primary
# scanner (no workflow file needed — one switch in Settings); this is
# the second opinion, because the two scanners catch different things.
# Runs on every push and pull request, plus a weekly scheduled run so
# new rules also catch old code.
name: Semgrep

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: semgrep ci --sarif --output semgrep.sarif --config auto
        env:
          # Optional: add SEMGREP_APP_TOKEN as a repo secret to use the
          # Semgrep platform (triage, cross-file rules). Without it,
          # `semgrep ci` still runs the open-source ruleset.
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: semgrep.sarif
